<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ayden Morgan</title>
  <link rel="stylesheet" href="css/styles.css" />

  <!-- Hide body initially -->
  <style>
    body {
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    body.loaded {
      visibility: visible;
      opacity: 1;
    }
  </style>
</head>
<body class="index">
  <a href="index.html" class="home-link">Ayden Morgan</a>

  <main class="container">
    <h1 class="name">Ayden Morgan</h1>
    <p class="subtitle">some things I've captured & made</p>

    <div class="card-grid">
      <div class="card">
        <a href="photos.html">
          <img src="images/scimage3.png" alt="Photos" />
        </a>
        <p class="label">Photos</p>
      </div>
      <div class="card">
        <a href="projects.html">
          <img src="images/liltrees-preview.png" alt="Projects" />
        </a>
        <p class="label">Projects</p>
      </div>
    </div>
  </main>

  <!-- JavaScript to reveal body after load + preload assets -->
  <script>
    window.addEventListener('load', () => {
      // Reveal the page
      document.body.classList.add('loaded');

      // Preload these images in the background
      const preloadImages = [
        "images/scimage1.png",
        "images/scimage2.png",
        "images/scimage7.png",
        "images/scimage8.png",
        "images/scimage9.png",
        "images/hellocampus-preview8.png",
        "images/dsp-preview2.png"
      ];

      preloadImages.forEach(src => {
        const img = new Image();
        img.src = src;
      });
    });
  </script>
</body>
</html>
