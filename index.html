<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ayden Morgan</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="index">
  <a href="index.html" class="home-link">Ayden Morgan</a>

  <main class="container">
    <h1 class="name">Ayden Morgan</h1>
    <p class="subtitle">some things I've captured & made</p>

    <div class="card-grid">
      <div class="card">
        <a href="photos.html">
          <!-- Photos card image — NOT lazy-loaded for immediate display -->
          <img src="images/scimage3.png" alt="Photos" />
        </a>
        <p class="label">Photos</p>
      </div>
      <div class="card">
        <a href="projects.html">
          <!-- Projects card image — NOT lazy-loaded for immediate display -->
          <img src="images/liltrees-preview.png" alt="Projects" />
        </a>
        <p class="label">Projects</p>
      </div>
    </div>
  </main>

  <!-- Preload script: runs AFTER full page load -->
  <script>
    window.addEventListener('load', () => {
      const preloadImages = [
        "images/scimage1.png",
        "images/scimage2.png",
        "images/scimage3.png",
        "images/scimage4.png",
        "images/hellocampus-preview8.png",
        "images/dsp-preview2.png"
      ];

      preloadImages.forEach(src => {
        const img = new Image();
        img.src = src;
      });
    });
  </script>
</body>
</html>
