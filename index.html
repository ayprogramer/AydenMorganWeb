<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ayden Morgan</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="index">
  <div id="loader" class="loader" aria-hidden="true"></div>

  <a href="index.html" class="home-link">Ayden Morgan</a>

  <main class="container">
    <h1 class="name">Ayden Morgan</h1>
    <p class="subtitle">Some things I've seen & made</p>

    <div class="card-grid">
      <div class="card">
        <a href="photos.html">
          <img src="images/scimage3.png" alt="Photos" />
        </a>
        <p class="label">Photos</p>
      </div>
      <div class="card">
        <a href="projects.html">
          <img src="images/liltrees-preview.png" alt="Projects" />
        </a>
        <p class="label">Products</p>
      </div>
    </div>
  </main>

  <script>
    (() => {
      const MIN_DELAY = 130;
      const startTime = performance.now();
      const loader = document.getElementById('loader');

      window.addEventListener('load', () => {
        const elapsed = performance.now() - startTime;
        const remaining = Math.max(MIN_DELAY - elapsed, 0);
        setTimeout(() => loader.classList.add('done'), remaining);
      });
    })();
  </script>

  <script>
    window.addEventListener('load', () => {
      const preloadImages = [
        "images/scimage1.png",
        "images/scimage2.png",
        "images/scimage3.png",
        "images/scimage4.png",
        "images/hellocampus-preview8.png",
        "images/dsp-preview2.png"
      ];
      preloadImages.forEach(src => {
        const img = new Image();
        img.src = src;
      });
    });
  </script>
</body>
</html>
