<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Slither — Ayden Morgan</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a12;font-family:'Urbanist',sans-serif;color:#fff}
canvas{display:block;position:absolute;top:0;left:0}

/* ── back / menu chrome ── */
.back-link{position:fixed;top:1.7rem;left:3.3rem;font-size:2rem;padding:0 1.1rem;font-weight:600;border-radius:12px;color:#fff;text-decoration:none;background:rgba(255,255,255,.12);backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);border:1px solid rgba(255,255,255,.15);box-shadow:inset 0 0 .25rem rgba(255,255,255,.1),0 6px 20px rgba(0,0,0,.3);transition:background .3s,transform .2s,box-shadow .3s;z-index:3000}
.back-link:hover{background:rgba(255,255,255,.22);transform:translateY(-2px)}
.menu-btn{position:fixed;top:2rem;right:3rem;z-index:3001;width:36px;height:36px;background:none;border:none;display:flex;flex-direction:column;justify-content:center;gap:6px;cursor:pointer}
.menu-btn span{display:block;height:3px;width:100%;background:rgba(255,255,255,.55);border-radius:2px;transition:all .2s}
.menu-overlay{display:none;position:fixed;z-index:4000;inset:0;background:#0a0a12;align-items:center;justify-content:center;flex-direction:column;opacity:0;transition:opacity .35s cubic-bezier(.4,0,.2,1)}
.menu-overlay.active{display:flex;opacity:1}
.close-menu{position:absolute;top:2rem;right:3rem;font-size:2.25rem;width:36px;height:36px;background:none;border:none;color:rgba(255,255,255,.55);cursor:pointer;z-index:4001;display:flex;align-items:center;justify-content:center;opacity:0}
.menu-overlay.active .close-menu{opacity:1;font-size:2.8rem;width:48px;height:48px}
.menu-nav{display:flex;flex-direction:column;gap:2.5rem;align-items:center}
.menu-link{font-size:2rem;color:#fff;text-decoration:none;font-weight:600;opacity:0;transform:translateY(-30px);transition:opacity .5s,transform .5s}
.menu-overlay.active .menu-link{opacity:1;transform:translateY(0)}
.menu-overlay.active .menu-link:nth-child(1){transition-delay:.12s}
.menu-overlay.active .menu-link:nth-child(2){transition-delay:.22s}
.menu-overlay.active .menu-link:nth-child(3){transition-delay:.32s}
.menu-overlay.active .menu-link:nth-child(4){transition-delay:.42s}
.menu-overlay.active .menu-link:nth-child(5){transition-delay:.52s}

/* ── start screen ── */
#startScreen{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;background:#0a0a12}
#startScreen .card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:2.5rem 3rem;width:420px;max-width:92vw;text-align:center;backdrop-filter:blur(24px)}
#startScreen h1{font-size:2.2rem;font-weight:700;margin-bottom:.3rem;background:linear-gradient(135deg,#6ef,#f8a,#ff6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#startScreen .tagline{font-size:.95rem;color:rgba(255,255,255,.45);margin-bottom:2rem}
#startScreen label{display:block;text-align:left;font-size:.85rem;color:rgba(255,255,255,.5);margin-bottom:.4rem;font-weight:500}
#nameInput{width:100%;padding:.7rem 1rem;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.07);color:#fff;font-size:1rem;font-family:inherit;outline:none;transition:border-color .2s}
#nameInput:focus{border-color:rgba(110,238,255,.5)}
#nameInput::placeholder{color:rgba(255,255,255,.25)}
.skin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:.6rem 0 1.8rem}
.skin-opt{height:38px;border-radius:10px;border:2px solid transparent;cursor:pointer;transition:border-color .15s,transform .15s;overflow:hidden;position:relative}
.skin-opt:hover{transform:scale(1.06)}
.skin-opt.selected{border-color:#fff;transform:scale(1.08)}
.skin-opt canvas{width:100%;height:100%;display:block;border-radius:8px}
#playBtn{width:100%;padding:.85rem;border:none;border-radius:12px;background:linear-gradient(135deg,#6ef,#48f);color:#000;font-size:1.15rem;font-weight:700;font-family:inherit;cursor:pointer;transition:transform .15s,box-shadow .15s}
#playBtn:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(72,136,255,.35)}

/* ── death screen ── */
#deathScreen{position:fixed;inset:0;z-index:2500;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.72);backdrop-filter:blur(6px)}
#deathScreen .card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:2.5rem 3rem;width:380px;max-width:90vw;text-align:center}
#deathScreen h2{font-size:1.8rem;font-weight:700;margin-bottom:1.2rem}
#deathScreen .stat{font-size:1rem;color:rgba(255,255,255,.6);margin-bottom:.5rem}
#deathScreen .stat span{color:#fff;font-weight:600}
#replayBtn{margin-top:1.5rem;width:100%;padding:.8rem;border:none;border-radius:12px;background:linear-gradient(135deg,#6ef,#48f);color:#000;font-size:1.1rem;font-weight:700;font-family:inherit;cursor:pointer;transition:transform .15s}
#replayBtn:hover{transform:translateY(-2px)}

/* ── HUD ── */
#hud{position:fixed;top:0;left:0;right:0;pointer-events:none;z-index:1500;padding:1rem 1.2rem}
#hud *{pointer-events:none}
.hud-score{position:absolute;top:5.5rem;left:50%;transform:translateX(-50%);font-size:1.1rem;font-weight:600;color:rgba(255,255,255,.85);text-shadow:0 2px 8px rgba(0,0,0,.5)}
.hud-score span{font-size:1.6rem}
.hud-boost{position:absolute;top:7.6rem;left:50%;transform:translateX(-50%);width:120px;height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.hud-boost-fill{height:100%;background:linear-gradient(90deg,#6ef,#48f);border-radius:3px;transition:width .15s}
.hud-leaderboard{position:absolute;top:5rem;right:1.2rem;background:rgba(0,0,0,.35);border-radius:12px;padding:.8rem 1rem;min-width:170px;backdrop-filter:blur(8px)}
.hud-leaderboard h3{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.4);margin-bottom:.5rem}
.hud-leaderboard ol{list-style:none;padding:0;font-size:.8rem;line-height:1.7}
.hud-leaderboard li{color:rgba(255,255,255,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.hud-leaderboard li.me{color:#6ef;font-weight:600}
.hud-minimap{position:fixed;bottom:1.2rem;right:1.2rem;z-index:1500}

@media(max-width:600px){
  .back-link{left:1.5rem;font-size:1.5rem;top:2.15rem}
  .menu-btn{right:1.5rem;top:2.15rem;width:28px;height:28px}
  .close-menu{right:1.5rem;top:2.15rem}
  #startScreen .card{padding:2rem 1.5rem}
  .skin-grid{grid-template-columns:repeat(3,1fr)}
  .hud-leaderboard{display:none}
}
</style>
</head>
<body>

<!-- site chrome -->
<a href="../projects.html" class="back-link">&larr;</a>
<button id="menu-btn" class="menu-btn" aria-label="Open menu"><span></span><span></span><span></span></button>
<div id="menu-overlay" class="menu-overlay" aria-hidden="true">
  <button id="close-menu" class="close-menu" aria-label="Close menu">&times;</button>
  <nav class="menu-nav">

</div>

<!-- start screen -->
<div id="startScreen">
  <div class="card">
    <h1>Slither</h1>
    <p class="tagline">Eat, grow, survive.</p>
    <label for="nameInput">Nickname</label>

    <label style="margin-top:1.2rem">Choose Skin</label>

<div id="deathScreen">

<!-- HUD -->
<div id="hud" style="display:none">
  <div class="hud-score">Score <span id="hudScore">0</span></div>

</div>
<canvas class="hud-minimap" id="minimap" width="140" height="140" style="display:none"></canvas>

<!-- game canvas -->
<canvas id="gc"></canvas>

<script>
(function(){
"use strict";

/* ═══════════════════════════════════════
   MENU
   ═══════════════════════════════════════ */
const menuBtn=document.getElementById('menu-btn'),menuOv=document.getElementById('menu-overlay'),menuCl=document.getElementById('close-menu');
function closeMenu(){menuOv.classList.remove('active');setTimeout(()=>{menuOv.style.display='none';menuOv.setAttribute('aria-hidden','true')},350)}
menuBtn.addEventListener('click',()=>{menuOv.classList.add('active');menuOv.style.display='flex';menuOv.setAttribute('aria-hidden','false')});
menuCl.addEventListener('click',closeMenu);
menuOv.addEventListener('click',e=>{if(e.target===menuOv)closeMenu()});

/* ═══════════════════════════════════════
   CONSTANTS
   ═══════════════════════════════════════ */
const MAP_R = 3000;
const BASE_SPEED = 180;
const BOOST_MULT = 2.2;
const SEG_SPACING = 8;
const HEAD_R = 12;
const MIN_BOOST_LEN = 12;
const FOOD_CAP = 900;
const BOT_COUNT = 16;
const GRID_CELL = 120;

/* ═══════════════════════════════════════
   SKINS
   ═══════════════════════════════════════ */
const SKINS = [
  ['#ff4d4d','#ff9e3d','#ffe04d'],
  ['#4df','#48f','#a06ef8'],
  ['#4f4','#0c6','#0a8'],
  ['#f6f','#f3a','#fa6'],
  ['#fff','#aaa','#555'],
  ['#ff3c3c','#fff','#3c6cff'],
  ['#ff0','#f80','#f00'],
  ['#0ff','#0f0','#ff0','#f0f','#f00','#00f'],
  ['#f94','#fc4','#fe6'],
  ['#6ef','#4df','#38f'],
  ['#b8ff6e','#6ef','#48f'],
  ['#f55','#000','#f55','#000'],
];

let selectedSkin = 0;

/* ═══════════════════════════════════════
   SKIN PICKER UI
   ═══════════════════════════════════════ */
const skinGrid = document.getElementById('skinGrid');
SKINS.forEach((cols,i)=>{
  const opt = document.createElement('div');
  opt.className = 'skin-opt' + (i===0?' selected':'');
  const c = document.createElement('canvas');
  c.width=120;c.height=38;
  const cx=c.getContext('2d');
  const sw=120/cols.length;
  cols.forEach((co,j)=>{cx.fillStyle=co;cx.fillRect(j*sw,0,sw+1,38)});
  opt.appendChild(c);
  opt.addEventListener('click',()=>{
    skinGrid.querySelectorAll('.skin-opt').forEach(s=>s.classList.remove('selected'));
    opt.classList.add('selected');
    selectedSkin=i;
  });
  skinGrid.appendChild(opt);
});

/* ═══════════════════════════════════════
   DOM REFS
   ═══════════════════════════════════════ */
const startScreen = document.getElementById('startScreen');
const deathScreen = document.getElementById('deathScreen');
const playBtn = document.getElementById('playBtn');
const replayBtn = document.getElementById('replayBtn');
const nameInput = document.getElementById('nameInput');
const hudEl = document.getElementById('hud');
const hudScore = document.getElementById('hudScore');
const hudBoost = document.getElementById('hudBoost');
const hudLB = document.getElementById('hudLB');
const minimapC = document.getElementById('minimap');
const minimapCtx = minimapC.getContext('2d');
const gc = document.getElementById('gc');
const ctx = gc.getContext('2d');

/* ═══════════════════════════════════════
   GAME STATE
   ═══════════════════════════════════════ */
let W, H;
let running = false;
let player = null;
let snakes = [];
let foods = [];
let particles = [];
let camera = {x:0, y:0};
let mouse = {x:0, y:0, active:false};
let keys = {left:false, right:false, up:false, boost:false};
let lastTime = 0;

const BOT_NAMES = [
  'Noodle','Slinky','Viper','Coil','Zigzag','Slick','Fang','Blitz',
  'Mamba','Cobra','Hiss','Rattle','Scales','Byte','Pixel','Glitch',
  'Nova','Drift','Echo','Flux','Orion','Zephyr','Pulse','Jade',
  'Storm','Blaze','Frost','Shadow','Luna','Turbo','Nitro','Phantom',
  'Ripple','Spark','Thorn','Whisper','Bolt','Cinder','Dusk','Flash'
];

function resize(){
  W=gc.width=window.innerWidth;
  H=gc.height=window.innerHeight;
}
window.addEventListener('resize',resize);
resize();

/* ═══════════════════════════════════════
   SPATIAL GRID
   ═══════════════════════════════════════ */
let spatialGrid = {};
function gridKey(x,y){return Math.floor(x/GRID_CELL)+','+Math.floor(y/GRID_CELL)}
function rebuildGrid(){
  spatialGrid={};
  for(let s=0;s<snakes.length;s++){
    const sn=snakes[s];
    if(!sn.alive)continue;
    for(let i=1;i<sn.segs.length;i++){
      const seg=sn.segs[i];
      const k=gridKey(seg.x,seg.y);
      if(!spatialGrid[k])spatialGrid[k]=[];
      spatialGrid[k].push({snake:s,seg:i,x:seg.x,y:seg.y});
    }
  }
}
function queryGrid(x,y,r){
  const out=[];
  const cr=Math.ceil(r/GRID_CELL)+1;
  const gx=Math.floor(x/GRID_CELL), gy=Math.floor(y/GRID_CELL);
  for(let dx=-cr;dx<=cr;dx++){
    for(let dy=-cr;dy<=cr;dy++){
      const k=(gx+dx)+','+(gy+dy);
      if(spatialGrid[k])out.push(...spatialGrid[k]);
    }
  }
  return out;
}

/* food spatial grid */
let foodGrid = {};
function rebuildFoodGrid(){
  foodGrid={};
  for(let i=0;i<foods.length;i++){
    const f=foods[i];
    const k=gridKey(f.x,f.y);
    if(!foodGrid[k])foodGrid[k]=[];
    foodGrid[k].push(i);
  }
}
function queryFoodGrid(x,y,r){
  const out=[];
  const cr=Math.ceil(r/GRID_CELL)+1;
  const gx=Math.floor(x/GRID_CELL), gy=Math.floor(y/GRID_CELL);
  for(let dx=-cr;dx<=cr;dx++){
    for(let dy=-cr;dy<=cr;dy++){
      const k=(gx+dx)+','+(gy+dy);
      if(foodGrid[k]){for(const i of foodGrid[k])out.push(i)}
    }
  }
  return out;
}

/* ═══════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════ */
function dist(a,b){const dx=a.x-b.x,dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy)}
function distSq(a,b){const dx=a.x-b.x,dy=a.y-b.y;return dx*dx+dy*dy}
function angleTo(a,b){return Math.atan2(b.y-a.y,b.x-a.x)}
function lerpAngle(a,b,t){
  let d=b-a;
  while(d>Math.PI)d-=2*Math.PI;
  while(d<-Math.PI)d+=2*Math.PI;
  return a+d*t;
}
function randRange(a,b){return a+Math.random()*(b-a)}
function randInt(a,b){return(Math.random()*(b-a+1)|0)+a}
function clamp(v,lo,hi){return v<lo?lo:v>hi?hi:v}

/* ═══════════════════════════════════════
   SNAKE FACTORY
   ═══════════════════════════════════════ */
function createSnake(name, skinIdx, x, y, isPlayer){
  const angle = Math.random()*Math.PI*2;
  const segs = [];
  for(let i=0;i<10;i++){
    segs.push({x: x - Math.cos(angle)*SEG_SPACING*i, y: y - Math.sin(angle)*SEG_SPACING*i});
  }
  return {
    name: name,
    skin: SKINS[skinIdx % SKINS.length],
    segs: segs,
    angle: angle,
    targetAngle: angle,
    speed: BASE_SPEED,
    score: 0,
    alive: true,
    boosting: false,
    isPlayer: isPlayer,
    boostTimer: 0,
    ai: isPlayer ? null : {
      type: ['wander','food','hunt','avoid'][randInt(0,3)],
      timer: 0,
      wanderAngle: angle,
      boostCooldown: 0,
    },
  };
}

function snakeRadius(sn){
  return HEAD_R * clamp(0.5 + sn.segs.length/120, 0.6, 1.4);
}

/* ═══════════════════════════════════════
   FOOD
   ═══════════════════════════════════════ */
function spawnFood(x, y, value, color){
  if(x===undefined){
    const a=Math.random()*Math.PI*2;
    const r=Math.random()*MAP_R*0.95;
    x=Math.cos(a)*r; y=Math.sin(a)*r;
  }
  foods.push({
    x:x, y:y,
    value: value||1,
    r: (value||1)>1 ? 5 : 3.5,
    color: color || `hsl(${Math.random()*360|0},85%,65%)`,
    pulse: Math.random()*Math.PI*2,
  });
}

function initFood(){
  foods=[];
  for(let i=0;i<FOOD_CAP;i++) spawnFood();
}

/* ═══════════════════════════════════════
   PARTICLES
   ═══════════════════════════════════════ */
function addParticle(x,y,color,vx,vy,life){
  particles.push({x,y,color,vx:vx||randRange(-60,60),vy:vy||randRange(-60,60),life:life||0.6,maxLife:life||0.6,r:randRange(2,5)});
}

/* ═══════════════════════════════════════
   INIT GAME
   ═══════════════════════════════════════ */
function startGame(){
  const pName = nameInput.value.trim() || 'Player';
  const spawnA = Math.random()*Math.PI*2;
  const spawnR = Math.random()*MAP_R*0.4;
  player = createSnake(pName, selectedSkin, Math.cos(spawnA)*spawnR, Math.sin(spawnA)*spawnR, true);
  snakes = [player];

  for(let i=0;i<BOT_COUNT;i++) spawnBot();

  initFood();
  particles = [];

  startScreen.style.display='none';
  deathScreen.style.display='none';
  hudEl.style.display='';
  minimapC.style.display='';
  mouse.active=false;

  running=true;
  lastTime=performance.now();
  requestAnimationFrame(gameLoop);
}

function spawnBot(){
  const a=Math.random()*Math.PI*2;
  const r=randRange(200,MAP_R*0.85);
  const name=BOT_NAMES[randInt(0,BOT_NAMES.length-1)];
  const skinIdx=randInt(0,SKINS.length-1);
  const bot=createSnake(name, skinIdx, Math.cos(a)*r, Math.sin(a)*r, false);
  const extraSegs = randInt(5,60);
  for(let i=0;i<extraSegs;i++){
    const last=bot.segs[bot.segs.length-1];
    bot.segs.push({x:last.x,y:last.y});
    bot.score+=1;
  }
  snakes.push(bot);
}

/* ═══════════════════════════════════════
   DEATH
   ═══════════════════════════════════════ */
function killSnake(sn){
  if(!sn.alive)return;
  sn.alive=false;
  for(let i=0;i<sn.segs.length;i++){
    const s=sn.segs[i];
    if(i%2===0) spawnFood(s.x+randRange(-8,8), s.y+randRange(-8,8), 3, sn.skin[i%sn.skin.length]);
    addParticle(s.x,s.y,sn.skin[i%sn.skin.length]);
  }
  if(sn.isPlayer){
    running=false;
    const sorted=[...snakes].filter(s=>s.alive||s===sn).sort((a,b)=>b.score-a.score);
    const rank=sorted.indexOf(sn)+1;
    document.getElementById('dScore').textContent=sn.score;
    document.getElementById('dLength').textContent=sn.segs.length;
    document.getElementById('dRank').textContent='#'+rank+' of '+(snakes.filter(s=>s.alive).length+1);
    setTimeout(()=>{deathScreen.style.display='flex'},400);
  }
}

/* ═══════════════════════════════════════
   CONTROLS
   ═══════════════════════════════════════ */
window.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.active=true});
window.addEventListener('touchstart',e=>{const t=e.touches[0];mouse.x=t.clientX;mouse.y=t.clientY;mouse.active=true},{passive:true});
window.addEventListener('touchmove',e=>{const t=e.touches[0];mouse.x=t.clientX;mouse.y=t.clientY;mouse.active=true},{passive:true});
window.addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft')keys.left=true;
  if(e.code==='ArrowRight')keys.right=true;
  if(e.code==='ArrowUp')keys.up=true;
  if(e.code==='Space'){keys.boost=true;e.preventDefault()}
});
window.addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft')keys.left=false;
  if(e.code==='ArrowRight')keys.right=false;
  if(e.code==='ArrowUp')keys.up=false;
  if(e.code==='Space')keys.boost=false;
});

/* ═══════════════════════════════════════
   UPDATE
   ═══════════════════════════════════════ */
function update(dt){
  /* player steering */
  if(player && player.alive){
    if(mouse.active){
      const wx = camera.x + (mouse.x - W/2);
      const wy = camera.y + (mouse.y - H/2);
      player.targetAngle = Math.atan2(wy - player.segs[0].y, wx - player.segs[0].x);
    }
    if(keys.left) player.targetAngle -= 3.5*dt;
    if(keys.right) player.targetAngle += 3.5*dt;
    player.boosting = (keys.boost || keys.up) && player.segs.length > MIN_BOOST_LEN;
  }

  /* update each snake */
  for(const sn of snakes){
    if(!sn.alive)continue;

    /* AI */
    if(sn.ai) updateAI(sn, dt);

    /* speed */
    sn.speed = sn.boosting ? BASE_SPEED*BOOST_MULT : BASE_SPEED;

    /* turn */
    const turnRate = sn.boosting ? 3.0 : 4.0;
    sn.angle = lerpAngle(sn.angle, sn.targetAngle, turnRate*dt);

    /* move head */
    const head = sn.segs[0];
    head.x += Math.cos(sn.angle)*sn.speed*dt;
    head.y += Math.sin(sn.angle)*sn.speed*dt;

    /* body follows */
    for(let i=1;i<sn.segs.length;i++){
      const prev=sn.segs[i-1], cur=sn.segs[i];
      const dx=prev.x-cur.x, dy=prev.y-cur.y;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d>SEG_SPACING){
        const ratio=SEG_SPACING/d;
        cur.x=prev.x-dx*ratio;
        cur.y=prev.y-dy*ratio;
      }
    }

    /* boost shedding */
    if(sn.boosting){
      sn.boostTimer+=dt;
      if(sn.boostTimer>0.08){
        sn.boostTimer=0;
        if(sn.segs.length>MIN_BOOST_LEN){
          const tail=sn.segs.pop();
          spawnFood(tail.x,tail.y,1,sn.skin[sn.segs.length%sn.skin.length]);
          sn.score=Math.max(0,sn.score-1);
        }
      }
      const tail=sn.segs[sn.segs.length-1];
      if(Math.random()<0.3) addParticle(tail.x,tail.y,sn.skin[0],randRange(-20,20),randRange(-20,20),0.35);
    }

    /* boundary check */
    const hd=Math.sqrt(head.x*head.x+head.y*head.y);
    if(hd>MAP_R){
      killSnake(sn);
    }

    /* eat food */
    const hr=snakeRadius(sn);
    const nearFoods=queryFoodGrid(head.x,head.y,hr+10);
    for(const fi of nearFoods){
      const f=foods[fi];
      if(!f)continue;
      if(distSq(head,f)<(hr+f.r)*(hr+f.r)){
        sn.score+=f.value;
        const newSeg={...sn.segs[sn.segs.length-1]};
        for(let v=0;v<f.value;v++) sn.segs.push({x:newSeg.x,y:newSeg.y});
        foods[fi]=null;
      }
    }
  }

  /* compact food array periodically */
  foods = foods.filter(f=>f!==null);
  while(foods.length<FOOD_CAP) spawnFood();

  /* rebuild grids */
  rebuildGrid();
  rebuildFoodGrid();

  /* snake-snake collisions */
  for(const sn of snakes){
    if(!sn.alive)continue;
    const head=sn.segs[0];
    const hr=snakeRadius(sn);
    const near=queryGrid(head.x,head.y,hr+HEAD_R*1.5);
    for(const cell of near){
      if(snakes[cell.snake]===sn)continue;
      if(!snakes[cell.snake].alive)continue;
      const dx=head.x-cell.x,dy=head.y-cell.y;
      const segR=snakeRadius(snakes[cell.snake])*0.85;
      if(dx*dx+dy*dy<(hr+segR-4)*(hr+segR-4)){
        killSnake(sn);
        break;
      }
    }
  }

  /* respawn bots */
  const aliveCount = snakes.filter(s=>!s.isPlayer && s.alive).length;
  if(aliveCount < BOT_COUNT){
    spawnBot();
  }

  /* particles */
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.life-=dt;
    if(p.life<=0) particles.splice(i,1);
  }

  /* camera */
  if(player && player.alive){
    camera.x += (player.segs[0].x - camera.x)*5*dt;
    camera.y += (player.segs[0].y - camera.y)*5*dt;
  }
}

/* ═══════════════════════════════════════
   BOT AI
   ═══════════════════════════════════════ */
function updateAI(sn, dt){
  const ai=sn.ai;
  const head=sn.segs[0];
  ai.timer-=dt;
  ai.boostCooldown-=dt;

  /* check boundary proximity first — override everything to steer inward */
  const distToCenter = Math.sqrt(head.x*head.x + head.y*head.y);
  if(distToCenter > MAP_R*0.85){
    sn.targetAngle = Math.atan2(-head.y, -head.x);
    sn.boosting=false;
    return;
  }

  /* danger detection: look for nearby larger snake heads */
  let danger = null;
  let dangerDist = 250;
  for(const other of snakes){
    if(other===sn||!other.alive)continue;
    const d=dist(head,other.segs[0]);
    if(d<dangerDist && other.segs.length > sn.segs.length*0.8){
      danger=other;
      dangerDist=d;
    }
  }
  if(danger && ai.type!=='hunt'){
    const awayAngle = Math.atan2(head.y-danger.segs[0].y, head.x-danger.segs[0].x);
    sn.targetAngle = awayAngle;
    sn.boosting = sn.segs.length>MIN_BOOST_LEN && ai.boostCooldown<=0;
    if(sn.boosting) ai.boostCooldown=2;
    return;
  }

  if(ai.timer>0)return;
  ai.timer=randRange(0.3,1.0);

  if(ai.type==='wander'){
    ai.wanderAngle += randRange(-0.8,0.8);
    sn.targetAngle = ai.wanderAngle;
    sn.boosting=false;

    /* but steer toward nearby food if close */
    const nearFoods=queryFoodGrid(head.x,head.y,200);
    let bestD=Infinity, bestF=null;
    for(const fi of nearFoods){
      const f=foods[fi]; if(!f)continue;
      const d=distSq(head,f);
      if(d<bestD){bestD=d;bestF=f}
    }
    if(bestF) sn.targetAngle=angleTo(head,bestF);
  }
  else if(ai.type==='food'){
    const nearFoods=queryFoodGrid(head.x,head.y,400);
    let bestD=Infinity, bestF=null;
    for(const fi of nearFoods){
      const f=foods[fi]; if(!f)continue;
      const d=distSq(head,f);
      if(d<bestD){bestD=d;bestF=f}
    }
    if(bestF){
      sn.targetAngle=angleTo(head,bestF);
    } else {
      ai.wanderAngle += randRange(-0.6,0.6);
      sn.targetAngle=ai.wanderAngle;
    }
    sn.boosting=false;
  }
  else if(ai.type==='hunt'){
    let prey=null, preyDist=500;
    for(const other of snakes){
      if(other===sn||!other.alive)continue;
      const d=dist(head,other.segs[0]);
      if(d<preyDist && other.segs.length<sn.segs.length*0.7){
        prey=other; preyDist=d;
      }
    }
    if(prey){
      const predictX=prey.segs[0].x+Math.cos(prey.angle)*80;
      const predictY=prey.segs[0].y+Math.sin(prey.angle)*80;
      sn.targetAngle=Math.atan2(predictY-head.y,predictX-head.x);
      sn.boosting=sn.segs.length>MIN_BOOST_LEN+10 && preyDist<300 && ai.boostCooldown<=0;
      if(sn.boosting) ai.boostCooldown=3;
    } else {
      ai.wanderAngle+=randRange(-0.5,0.5);
      sn.targetAngle=ai.wanderAngle;
      sn.boosting=false;
    }
  }
  else { /* avoid */
    let threat=null, threatD=350;
    for(const other of snakes){
      if(other===sn||!other.alive)continue;
      const d=dist(head,other.segs[0]);
      if(d<threatD){threat=other;threatD=d}
    }
    if(threat){
      sn.targetAngle=Math.atan2(head.y-threat.segs[0].y,head.x-threat.segs[0].x);
      sn.boosting=sn.segs.length>MIN_BOOST_LEN && threatD<180 && ai.boostCooldown<=0;
      if(sn.boosting) ai.boostCooldown=2;
    } else {
      /* seek food */
      const nearFoods=queryFoodGrid(head.x,head.y,300);
      let bestD=Infinity, bestF=null;
      for(const fi of nearFoods){
        const f=foods[fi]; if(!f)continue;
        const d=distSq(head,f);
        if(d<bestD){bestD=d;bestF=f}
      }
      if(bestF) sn.targetAngle=angleTo(head,bestF);
      else { ai.wanderAngle+=randRange(-0.6,0.6); sn.targetAngle=ai.wanderAngle; }
      sn.boosting=false;
    }
  }
}

/* ═══════════════════════════════════════
   RENDER
   ═══════════════════════════════════════ */
function render(){
  ctx.fillStyle='#0a0a12';
  ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.translate(W/2-camera.x, H/2-camera.y);

  drawGrid();
  drawBoundary();
  drawFoods();
  drawParticles();
  drawSnakes();

  ctx.restore();

  drawHUD();
  drawMinimap();
}

/* background grid */
function drawGrid(){
  const gs=60;
  const sx=Math.floor((camera.x-W/2)/gs)*gs;
  const sy=Math.floor((camera.y-H/2)/gs)*gs;
  const ex=camera.x+W/2+gs;
  const ey=camera.y+H/2+gs;
  ctx.strokeStyle='rgba(255,255,255,0.03)';
  ctx.lineWidth=1;
  ctx.beginPath();
  for(let x=sx;x<=ex;x+=gs){ctx.moveTo(x,sy);ctx.lineTo(x,ey)}
  for(let y=sy;y<=ey;y+=gs){ctx.moveTo(sx,y);ctx.lineTo(ex,y)}
  ctx.stroke();
}

/* circular boundary */
function drawBoundary(){
  ctx.beginPath();
  ctx.arc(0,0,MAP_R,0,Math.PI*2);
  ctx.strokeStyle='rgba(255,60,60,0.25)';
  ctx.lineWidth=8;
  ctx.stroke();

  /* danger glow near boundary */
  ctx.beginPath();
  ctx.arc(0,0,MAP_R+20,0,Math.PI*2);
  ctx.strokeStyle='rgba(255,60,60,0.08)';
  ctx.lineWidth=40;
  ctx.stroke();
}

/* hex to rgba helper */
function hexToRgba(hex, alpha){
  let c=hex.replace('#','');
  if(c.length===3) c=c[0]+c[0]+c[1]+c[1]+c[2]+c[2];
  const n=parseInt(c,16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${alpha})`;
}
function colorWithAlpha(col, alpha){
  if(col.startsWith('#')) return hexToRgba(col,alpha);
  if(col.startsWith('hsl(')) return col.replace('hsl(','hsla(').replace(')',','+alpha+')');
  if(col.startsWith('rgb(')) return col.replace('rgb(','rgba(').replace(')',','+alpha+')');
  return col;
}

/* foods */
function drawFoods(){
  const vx1=camera.x-W/2-20, vy1=camera.y-H/2-20;
  const vx2=camera.x+W/2+20, vy2=camera.y+H/2+20;
  const time=performance.now()/1000;
  for(const f of foods){
    if(f.x<vx1||f.x>vx2||f.y<vy1||f.y>vy2)continue;
    const pr=f.r+Math.sin(time*3+f.pulse)*1.2;
    ctx.beginPath();
    ctx.arc(f.x,f.y,pr,0,Math.PI*2);
    ctx.fillStyle=f.color;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(f.x,f.y,pr+3,0,Math.PI*2);
    ctx.fillStyle=colorWithAlpha(f.color,0.15);
    ctx.globalAlpha=0.3;
    ctx.fill();
    ctx.globalAlpha=1;
  }
}

/* particles */
function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha=clamp(p.life/p.maxLife,0,1);
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r*(p.life/p.maxLife),0,Math.PI*2);
    ctx.fillStyle=p.color;
    ctx.fill();
  }
  ctx.globalAlpha=1;
}

/* snakes */
function drawSnakes(){
  const sorted=[...snakes].filter(s=>s.alive);
  /* draw player last so it appears on top */
  sorted.sort((a,b)=> a.isPlayer?1 : b.isPlayer?-1 : 0);

  for(const sn of sorted){
    const segs=sn.segs;
    const baseR=snakeRadius(sn);

    /* body glow */
    ctx.lineCap='round';
    ctx.lineJoin='round';
    ctx.lineWidth=baseR*2+8;
    ctx.strokeStyle=colorWithAlpha(sn.skin[0],0.12);
    ctx.globalAlpha=0.15;
    ctx.beginPath();
    ctx.moveTo(segs[0].x,segs[0].y);
    for(let i=1;i<segs.length;i++) ctx.lineTo(segs[i].x,segs[i].y);
    ctx.stroke();
    ctx.globalAlpha=1;

    /* body segments */
    for(let i=segs.length-1;i>=1;i--){
      const t=1-i/segs.length;
      const r=baseR*(0.4+t*0.6);
      const col=sn.skin[i%sn.skin.length];
      ctx.beginPath();
      ctx.arc(segs[i].x,segs[i].y,r,0,Math.PI*2);
      ctx.fillStyle=col;
      ctx.fill();
    }

    /* head */
    const hx=segs[0].x, hy=segs[0].y;
    ctx.beginPath();
    ctx.arc(hx,hy,baseR*1.08,0,Math.PI*2);
    ctx.fillStyle=sn.skin[0];
    ctx.fill();

    /* eyes */
    const ea=sn.angle;
    const eyeOff=baseR*0.45;
    const eyeR=baseR*0.32;
    const pupilR=eyeR*0.55;
    for(let side=-1;side<=1;side+=2){
      const ex=hx+Math.cos(ea+side*0.5)*eyeOff;
      const ey_=hy+Math.sin(ea+side*0.5)*eyeOff;
      ctx.beginPath();
      ctx.arc(ex,ey_,eyeR,0,Math.PI*2);
      ctx.fillStyle='#fff';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(ex+Math.cos(ea)*pupilR*0.4, ey_+Math.sin(ea)*pupilR*0.4, pupilR,0,Math.PI*2);
      ctx.fillStyle='#111';
      ctx.fill();
    }

    /* name tag */
    if(sn.segs.length>3){
      ctx.font='600 11px Urbanist,sans-serif';
      ctx.textAlign='center';
      ctx.fillStyle='rgba(255,255,255,0.75)';
      ctx.fillText(sn.name, hx, hy-baseR-8);
    }
  }
}

/* ═══════════════════════════════════════
   HUD
   ═══════════════════════════════════════ */
function drawHUD(){
  if(!player)return;
  hudScore.textContent=player.score;

  /* boost bar */
  const boostPct = player.alive ? clamp((player.segs.length-MIN_BOOST_LEN)/(MIN_BOOST_LEN*2),0,1)*100 : 0;
  hudBoost.style.width=boostPct+'%';

  /* leaderboard */
  const sorted=[...snakes].filter(s=>s.alive).sort((a,b)=>b.score-a.score).slice(0,10);
  let html='';
  sorted.forEach((s,i)=>{
    const cls=s.isPlayer?' class="me"':'';
    const name=s.name.length>12?s.name.slice(0,12)+'…':s.name;
    html+=`<li${cls}>${i+1}. ${name} — ${s.score}</li>`;
  });
  hudLB.innerHTML=html;
}

/* minimap */
function drawMinimap(){
  if(!player||!player.alive)return;
  const mc=minimapCtx;
  const mw=140, mh=140;
  const scale=mw/(MAP_R*2.2);

  mc.clearRect(0,0,mw,mh);
  mc.fillStyle='rgba(0,0,0,0.4)';
  mc.fillRect(0,0,mw,mh);

  mc.save();
  mc.translate(mw/2,mh/2);

  /* boundary */
  mc.beginPath();
  mc.arc(0,0,MAP_R*scale,0,Math.PI*2);
  mc.strokeStyle='rgba(255,100,100,0.35)';
  mc.lineWidth=1.5;
  mc.stroke();

  /* dots for snakes */
  for(const sn of snakes){
    if(!sn.alive)continue;
    const sx=sn.segs[0].x*scale;
    const sy=sn.segs[0].y*scale;
    mc.beginPath();
    mc.arc(sx,sy,sn.isPlayer?3:2,0,Math.PI*2);
    mc.fillStyle=sn.isPlayer?'#6ef':sn.skin[0];
    mc.fill();
  }

  mc.restore();
}

/* ═══════════════════════════════════════
   GAME LOOP
   ═══════════════════════════════════════ */
function gameLoop(ts){
  if(!running)return;
  const dt=Math.min((ts-lastTime)/1000, 0.05);
  lastTime=ts;

  update(dt);
  render();

  requestAnimationFrame(gameLoop);
}

/* ═══════════════════════════════════════
   EVENT BINDINGS
   ═══════════════════════════════════════ */
playBtn.addEventListener('click', startGame);
nameInput.addEventListener('keydown', e=>{if(e.key==='Enter')startGame()});
replayBtn.addEventListener('click', ()=>{
  deathScreen.style.display='none';
  hudEl.style.display='none';
  minimapC.style.display='none';
  startScreen.style.display='flex';
  startBgLoop();
});

/* render a static background while on start screen */
function drawBg(){
  if(running)return;
  ctx.fillStyle='#0a0a12';
  ctx.fillRect(0,0,W,H);
  const gs=60,time=performance.now()/1000;
  ctx.strokeStyle='rgba(255,255,255,0.025)';
  ctx.lineWidth=1;
  ctx.beginPath();
  for(let x=0;x<W;x+=gs){ctx.moveTo(x,0);ctx.lineTo(x,H)}
  for(let y=0;y<H;y+=gs){ctx.moveTo(0,y);ctx.lineTo(W,y)}
  ctx.stroke();
  for(let i=0;i<40;i++){
    const fx=((i*137.5+time*15)%W);
    const fy=((i*97.3+time*8)%H);
    const r=2+Math.sin(time*2+i)*1;
    ctx.beginPath();
    ctx.arc(fx,fy,r,0,Math.PI*2);
    ctx.fillStyle=`hsla(${(i*30)%360},80%,65%,0.25)`;
    ctx.fill();
  }
  requestAnimationFrame(drawBg);
}
function startBgLoop(){requestAnimationFrame(drawBg)}
startBgLoop();

})();
