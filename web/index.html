<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ayden Morgan</title>
  <style>
    /* Critical above-the-fold CSS */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { font-family: 'Urbanist', sans-serif; }
    body { text-align: center; padding-top: 6rem; padding-bottom: 4rem; }
    .container { max-width: 1200px; margin: 0 auto; padding-bottom: 0rem; }
    .name { font-size: 2.75rem; font-weight: 600; margin-bottom: 0.6rem; }
    .subtitle { font-size: 1.2rem; color: #666; margin-bottom: 4.5rem; }
    .card-grid { display: flex; justify-content: center; flex-wrap: wrap; gap: 2.25rem; }
    .card { width: 350px; display: flex; flex-direction: column; align-items: center; }
    .loader { position: fixed; inset: 0; background: white; z-index: 999; transition: opacity 0.2s ease; }
    .loader.done { opacity: 0; pointer-events: none; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="css/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="index">
  <div id="loader" class="loader" aria-hidden="true"></div>

  <div id="menu-container">
    <button id="menu-btn" class="menu-btn" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
    <div id="menu-overlay" class="menu-overlay" aria-hidden="true">
      <button id="close-menu" class="close-menu" aria-label="Close menu">&times;</button>
      <nav class="menu-nav">
        <a href="index.html" class="menu-link">Home</a>
        <a href="photos.html" class="menu-link">Photos</a>
        <a href="about.html" class="menu-link">About Me</a>
        <a href="projects.html" class="menu-link">Projects</a>
        <a href="mailto:aymorgan@calpoly.edu" class="menu-link">Contact</a>
      </nav>
    </div>
  </div>
  <script>
    (function(){var b=document.getElementById('menu-btn'),o=document.getElementById('menu-overlay'),c=document.getElementById('close-menu');if(!b||!o||!c)return;function close(){o.classList.remove('active');setTimeout(function(){o.style.display='none';o.setAttribute('aria-hidden','true')},350)}b.addEventListener('click',function(){o.classList.add('active');o.style.display='flex';o.setAttribute('aria-hidden','false');document.querySelectorAll('.menu-link').forEach(function(l){l.style.animation='none';void l.offsetWidth;l.style.animation=''})});c.addEventListener('click',close);o.addEventListener('click',function(e){if(e.target===o)close()})})();
  </script>

  <a href="index.html" class="home-link">Ayden Morgan</a>

  <main class="container page-transition">
    <h1 class="name">Ayden Morgan</h1>
    <p class="subtitle">Some Things I've Captured & Created</p>

    <div class="card-grid">
      <div class="card">
        <a href="photos.html">
          <img src="images/scimage3.jpg" alt="Photos" loading="lazy" width="350" height="195" />
        </a>
        <p class="label">Photos</p> 
      </div>
      <div class="card">
        <a href="about.html">
          <img src="images/scimage1.jpg" alt="About Me" loading="lazy" width="350" height="195" />
        </a>
        <p class="label">About Me</p>
      </div>
      <div class="card">
        <a href="projects.html">
          <img src="images/LTLogo3.jpg" alt="Projects" loading="lazy" width="350" height="233" />
        </a>
        <p class="label">Projects</p>
      </div>
    </div>
  </main>

  <script>
    (() => {
      const MIN_DELAY = 130;
      const startTime = performance.now();
      const loader = document.getElementById('loader');

      window.addEventListener('load', () => {
        const elapsed = performance.now() - startTime;
        const remaining = Math.max(MIN_DELAY - elapsed, 0);
        setTimeout(() => {
          loader.classList.add('done');
          // Trigger page transition
          document.querySelector('.page-transition').classList.add('loaded');
          // Animate cards
          setTimeout(() => {
            document.querySelectorAll('.card').forEach(card => card.classList.add('animate'));
          }, 200);
        }, remaining);
      });
    })();
  </script>

  <script>
    window.addEventListener('load', () => {
      const preloadImages = [
        "images/scimage1.jpg",
        "images/scimage2.jpg",
        "images/scimage3.jpg",
        "images/scimage4.jpg",
        "images/hellocampus-preview8.jpg",
        "images/dsp-preview2.jpg"
      ];
      preloadImages.forEach(src => {
        const img = new Image();
        img.src = src;
      });
    });
  </script>

</body>
</html>
