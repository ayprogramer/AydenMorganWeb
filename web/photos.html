<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photos ‑ Ayden Morgan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="css/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div id="loader" class="loader" aria-hidden="true"></div>

  <a href="index.html" class="home-link">Ayden Morgan</a>

  <div id="menu-container">
    <button id="menu-btn" class="menu-btn" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
    <div id="menu-overlay" class="menu-overlay" aria-hidden="true">
      <button id="close-menu" class="close-menu" aria-label="Close menu">&times;</button>
      <nav class="menu-nav">
        <a href="index.html" class="menu-link">Home</a>
        <a href="photos.html" class="menu-link">Photos</a>
        <a href="about.html" class="menu-link">About Me</a>
        <a href="projects.html" class="menu-link">Projects</a>
        <a href="mailto:aymorgan@calpoly.edu" class="menu-link">Contact</a>
      </nav>
    </div>
  </div>
  <script>
    (function(){var b=document.getElementById('menu-btn'),o=document.getElementById('menu-overlay'),c=document.getElementById('close-menu');if(!b||!o||!c)return;function close(){o.classList.remove('active');setTimeout(function(){o.style.display='none';o.setAttribute('aria-hidden','true')},350)}b.addEventListener('click',function(){o.classList.add('active');o.style.display='flex';o.setAttribute('aria-hidden','false');document.querySelectorAll('.menu-link').forEach(function(l){l.style.animation='none';void l.offsetWidth;l.style.animation=''})});c.addEventListener('click',close);o.addEventListener('click',function(e){if(e.target===o)close()})})();
  </script>

  <main class="container page-transition">
    <h1 class="name">Photos I've Taken</h1>
    <p class="subtitle">Theme: Looking Close & Far</p>

    <div class="gallery">
      <!-- your images -->
      <img src="images/scimage1.jpg" alt="Photo 1" loading="lazy">
      <img src="images/scimage2.jpg" alt="Photo 2" loading="lazy">
      <img src="images/scimage3.jpg" alt="Photo 3" loading="lazy">
      <img src="images/scimage4.jpg" alt="Photo 4" loading="lazy">
      <img src="images/scimage5.jpg" alt="Photo 5" loading="lazy">
      <img src="images/scimage6.jpg" alt="Photo 6" loading="lazy">
      <img src="images/scimage7.jpg" alt="Photo 7" loading="lazy">
      <img src="images/scimage8.jpg" alt="Photo 8" loading="lazy">
      <img src="images/scimage9.jpg" alt="Photo 9" loading="lazy">
      <img src="images/scimage10.jpg" alt="Photo 10" loading="lazy">
      <img src="images/scimage11.jpg" alt="Photo 11" loading="lazy">
      <img src="images/scimage12.jpg" alt="Photo 12" loading="lazy">
    </div>
  </main>

  <button class="back-to-top" onclick="scrollToTop()" aria-label="Back to top">↑</button>

  <script>
    (() => {
      const MIN_DELAY = 180;
      const startTime = performance.now();
      const loader = document.getElementById('loader');

      window.addEventListener('load', () => {
        const elapsed = performance.now() - startTime;
        const remaining = Math.max(MIN_DELAY - elapsed, 0);
        setTimeout(() => {
          loader.classList.add('done');
          // Trigger page transition
          document.querySelector('.page-transition').classList.add('loaded');
          // Animate gallery images with staggered delay
          setTimeout(() => {
            const images = document.querySelectorAll('.gallery img');
            images.forEach((img, index) => {
              setTimeout(() => {
                img.classList.add('animate');
              }, index * 50); // 50ms delay between each image
            });
          }, 400);
        }, remaining);
      });
    })();
  </script>

  <script>
    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.addEventListener('scroll', () => {
      const backToTop = document.querySelector('.back-to-top');
      if (window.scrollY > 300) {
        backToTop.classList.add('show');
      } else {
        backToTop.classList.remove('show');
      }
    });
  </script>

</body>
</html>
