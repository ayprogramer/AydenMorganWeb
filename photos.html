<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photos ‑ Ayden Morgan</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600&display=swap" rel="stylesheet">




</head>
<body>
  <div id="loader" class="loader" aria-hidden="true"></div>

  <a href="index.html" class="home-link">Ayden Morgan</a>

  <div id="menu-container"></div>
  <script>
    fetch('menu.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('menu-container').innerHTML = html;
        const script = document.createElement('script');
        script.src = 'menu.js';
        document.body.appendChild(script);
      });
  </script>

  <main class="container">
    <h1 class="name">Photos I've Taken</h1>
    <p class="subtitle">Theme: Looking Close & Far</p>

    <div class="gallery">
      <!-- your images -->
      <img src="images/scimage1.png" alt="Photo 1" loading="lazy">
      <img src="images/scimage2.png" alt="Photo 2" loading="lazy">
      <img src="images/scimage3.png" alt="Photo 3" loading="lazy">
      <img src="images/scimage4.png" alt="Photo 4" loading="lazy">
      <img src="images/scimage5.png" alt="Photo 5" loading="lazy">
      <img src="images/scimage6.png" alt="Photo 6" loading="lazy">
      <img src="images/scimage7.png" alt="Photo 7" loading="lazy">
      <img src="images/scimage8.png" alt="Photo 8" loading="lazy">
      <img src="images/scimage9.png" alt="Photo 9" loading="lazy">
      <img src="images/scimage10.png" alt="Photo 10" loading="lazy">
      <img src="images/scimage11.png" alt="Photo 11" loading="lazy">
      <img src="images/scimage12.png" alt="Photo 12" loading="lazy">
    </div>
  </main>

  <button class="back-to-top" onclick="scrollToTop()" aria-label="Back to top">↑</button>

  <script>
    (() => {
      const MIN_DELAY = 180;
      const startTime = performance.now();
      const loader = document.getElementById('loader');

      window.addEventListener('load', () => {
        const elapsed = performance.now() - startTime;
        const remaining = Math.max(MIN_DELAY - elapsed, 0);
        setTimeout(() => loader.classList.add('done'), remaining);
      });
    })();
  </script>

  <script>
    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.addEventListener('scroll', () => {
      const backToTop = document.querySelector('.back-to-top');
      if (window.scrollY > 300) {
        backToTop.classList.add('show');
      } else {
        backToTop.classList.remove('show');
      }
    });
  </script>
</body>
</html>
